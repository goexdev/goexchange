# docker-compose.yml
#
# This file orchestrates the docker-side of the goexchange stack:
#   - postgres   shared database
#   - redis      rate limiting + notifications
#   - vault      secret storage (local dev only; use hosted Vault in prod)
#   - mailhog    local SMTP sink for dev
#   - prometheus metrics scraper
#   - grafana    dashboards
#   - matching   the closed-source matching engine (private GHCR image)
#   - mm-bot     the closed-source per-pair market-making bot
#
# The API and scheduler run on the host (they are public-source Go
# binaries and are easier to iterate on without rebuilding an
# image). They connect to the matching engine over gRPC.
#
# Quick start:
#   cp .env.example .env   # edit JWT_SECRET and VAULT_TOKEN
#   docker compose up -d
#   # on the host, with the public repo checked out:
#   ./bin/api &
#   ./bin/scheduler &

services:
  postgres:
    image: postgres:16-alpine
    container_name: goexchange-postgres
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exchange}
    ports:
      - "5433:5432"
    volumes:
      - goexchange_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: goexchange-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6388:6379"
    volumes:
      - goexchange_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # HashiCorp Vault. For local dev we run a single-node dev
  # server. To exercise HA / Raft locally, override with
  # `docker compose -f compose.yml -f compose.ha.yml up` (see
  # compose.ha.yml).
  vault:
    image: hashicorp/vault:1.15
    container_name: goexchange-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-please_change_me}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      # Bind-mount the audit log directory so it survives
      # container restarts. Dev mode does not persist KV data,
      # but the audit trail should be durable for compliance.
      - ./deploy/vault/audit:/vault/audit
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP sink for local dev. Drop outbound email here instead of
  # hitting a real mail provider. The web UI at :8025 shows the
  # captured messages.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: goexchange-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  prometheus:
    image: prom/prometheus:latest
    container_name: goexchange-prometheus
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/prometheus/rules/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
    ports:
      - "9090:9090"
    # scrape the host-published API and scheduler endpoints
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: goexchange-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./deploy/grafana/goexchange-dashboard.json:/var/lib/grafana/dashboards/goexchange.json:ro
    ports:
      - "3000:3000"

  # The closed-source matching engine. Pulled from a private GHCR
  # image; the source lives in the private goexdev-core repository.
  #
  # The matching binary speaks gRPC on :50051 and connects to
  # Postgres at startup to load trading pairs and open orders. No
  # license server, no outbound auth: the public-private repo split
  # is what actually protects the source.
  matching:
    image: ghcr.io/goexdev/goexchange-core:latest
    container_name: goexchange-matching
    environment:
      GRPC_ADDR: ":50051"
      DATABASE_URL: "postgres://exchange:${POSTGRES_PASSWORD:-exchange}@postgres:5432/exchange?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50051:50051"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/50051 && exec 3<&-"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # The closed-source per-pair market-making bot. Pulled from
  # the same private GHCR image as matching but a different
  # tag (:mmbot). The bot binary listens on :50052 and dials the
  # matching engine over gRPC at matching:50051. It writes to the
  # shared Postgres for mmbot_bots / mmbot_fills (migration 0035
  # in the public API repository) and reads open orders from
  # matching's StreamTrades feed to attribute fills.
  #
  # In V1 the bot is admin-controlled via POST /admin/mmbot/*
  # against the public API on the host. There is no separate bot
  # UI; the same admin auth gates start/stop/status.
  mm-bot:
    image: ghcr.io/goexdev/goexchange-core:mmbot
    container_name: goexchange-mmbot
    environment:
      GRPC_ADDR: ":50052"
      MATCHING_ADDR: "matching:50051"
      DATABASE_URL: "postgres://exchange:***@postgres:5432/exchange?sslmode=disable"
      # UUID of the bot user row. Operators must INSERT a users
      # row, run migration 0036, then UPDATE is_bot_user = TRUE
      # before bringing this container up. The dev default is
      # `64bdc63f-12a5-419b-8d5f-9bfb4ed9fbd4` (alice_test); the
      # shipped image panics on startup if MMBOT_SYSTEM_USER_ID
      # is unset, so this compose value is the only thing keeping
      # a fresh deploy runnable in a non-prod environment.
      MMBOT_SYSTEM_USER_ID: "${MMBOT_SYSTEM_USER_ID:-64bdc63f-12a5-419b-8d5f-9bfb4ed9fbd4}"
      log_level: "${log_level:-info}"
    depends_on:
      postgres:
        condition: service_healthy
      matching:
        condition: service_healthy
    ports:
      - "50052:50052"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/50052 && exec 3<&-"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Signer daemon (closed-source). Pulled from ghcr.io just like
  # matching; the source lives in the private goexchange-core repo
  # and is garble-built. The daemon never reaches the public
  # internet; it only needs Vault (for the BIP-39 mnemonic) and the
  # public-repository wallet-api (via the host-mapped gRPC port).
  signer:
    image: ghcr.io/goexdev/goexchange-signer:latest
    container_name: goexchange-signer
    environment:
      LISTEN: ":50061"
      VAULT: "http://vault:8200"
      VAULT_TOKEN_FILE: "/run/secrets/vault_token"
      VAULT_ROLE_ID: "${VAULT_ROLE_ID:-}"
      CHAINS: "TRON"
    volumes:
      # The vault-token file is written by deploy-fresh.sh to a host
      # path and bind-mounted here. The host file is gitignored; the
      # daemon reads it at startup and keeps the mount in place so a
      # container restart does not require re-running deploy-fresh.
      - ./deploy/signer-token:/run/secrets/vault_token:ro
    depends_on:
      vault:
        condition: service_healthy
    ports:
      - "50061:50061"
    restart: unless-stopped
    healthcheck:
      # Alpine busybox sh does not support /dev/tcp. Use nc
      # instead so the liveness probe works against the gRPC
      # listener. nc is in the alpine base image.
      test: ["CMD", "nc", "-z", "127.0.0.1", "50061"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Wallet API daemon (public). Exposes wallet-only REST endpoints
  # (/wallet/v1/...) on :8098. The signer daemon dials the signer
  # over the private docker network; the API does not. We host this
  # as a service so it can scale independently of the public trading
  # API and so a wallet crash does not take user-facing endpoints
  # down. V1 runs on the host for ease of iteration; V2 will move
  # the binary into a slim alpine image.
  # wallet-api:
  #   image: ghcr.io/goexdev/goexchange-wallet-api:latest
  #   container_name: goexchange-wallet-api
  #   build:
  #     context: .
  #     dockerfile: cmd/wallet-api/Dockerfile
  #   environment:
  #     SIGNER_ADDR: "signer:50061"
  #     TRON_PRIMARY_URL: "${TRON_PRIMARY_URL}"
  #     TRON_BACKUP_URL: "${TRON_BACKUP_URL}"
  #     TRON_PRIMARY_KEY: "${TRON_PRIMARY_KEY}"
  #     TRON_BACKUP_KEY: "${TRON_BACKUP_KEY}"
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     signer: { condition: service_healthy }
  #   ports: ["8098:8098"]
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8098 && exec 3<&-"]
  #     interval: 30s
  #     timeout: 5s
  #     start_period: 10s
  #
  # TRON block scanner daemon (public). Polls the chain RPC for new
  # USDT-TRC20 transfers, persists credits to the deposits table.
  # Reads from the same vault secrets as the API; no outbound auth.
  # tron-scanner:
  #   image: ghcr.io/goexdev/goexchange-tron-scanner:latest
  #   container_name: goexchange-tron-scanner
  #   build:
  #     context: .
  #     dockerfile: cmd/tron-scanner/Dockerfile
  #   environment:
  #     TRON_PRIMARY_URL: "${TRON_PRIMARY_URL}"
  #     TRON_BACKUP_URL: "${TRON_BACKUP_URL}"
  #     TRON_PRIMARY_KEY: "${TRON_PRIMARY_KEY}"
  #     TRON_BACKUP_KEY: "${TRON_BACKUP_KEY}"
  #     TRON_POLL_SEC: "10"
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/health || exit 1"]
  #     interval: 30s

volumes:
  goexchange_pgdata:
  goexchange_redisdata:

# The host-side API and scheduler are not in this compose file.
# Run them from the public repo on the host:
#
#   cd /root/goexdev-public
#   set -a; source .env; set +a
#   ./bin/api &
#   ./bin/scheduler &
#
# Their gRPC client points at matching:50051 when launched from
# inside the compose network, or at localhost:50051 when launched
# from the host (the published port).
