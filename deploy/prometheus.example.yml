# Prometheus configuration for scraping goexchange API metrics.
#
# Add this job to your existing prometheus.yml:
#   scrape_configs:
#     - job_name: goexchange-api
#       scrape_interval: 15s
#       static_configs:
#         - targets: [goexchange.top:8099]  # Or internal hostname

scrape_configs:
  # goexchange API (port 8099)
  - job_name: goexchange-api
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - goexchange.top:8099   # Production
          # - localhost:8099   # Dev
        labels:
          service: goexchange-api
          env: prod

  # Optional: Matcher (port 8098)
  # Matcher doesn't expose /metrics yet, but can be added
  # - job_name: goexchange-matcher
  #   static_configs:
  #     - targets: [goexchange.top:8098]
