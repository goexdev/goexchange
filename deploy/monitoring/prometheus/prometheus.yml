# Prometheus configuration for goexchange monitoring.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: goexchange-monitor

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['localhost:9093']

# Rule files (alerting rules)
rule_files:
  - "rules/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus

  # goexchange API (port 8099)
  - job_name: goexchange-api
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:8099']
        labels:
          service: goexchange-api
          env: prod
          instance: goexchange.top
