[paths]
data = /var/lib/grafana/data
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
http_addr = 
http_port = 3002
domain = goexchange.top
root_url = https://goexchange.top/grafana/
serve_from_sub_path = false
static_root_path = public
enable_gzip = false
router_logging = false

[security]
admin_user = admin
admin_password = admin123
secret_key = SW2YcwTIb9zpOOhoPsLX
disable_initial_admin_password = false
cookie_secure = true
cookie_samesite = lax
allow_embedding = false

[users]
allow_sign_up = false
auto_assign_org_role = Viewer
default_theme = dark

[auth]
disable_login_form = false
disable_signout_menu = false
oauth_auto_login = false
login_error_message = invalid
login_cookie_name = grafana_session
login_maximum_inactive_lifetime_days = 7
login_maximum_lifetime_days = 30
token_rotation_interval_minutes = 10
disable_signout = false

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true

[log]
level = info
mode = console

[log.console]
level = 

[metrics]
basic_auth_username = 
basic_auth_password = 
enabled = true
interval_seconds = 60

[unified_alerting]
enabled = true
alertmanager_config = /etc/grafana/provisioning/alerting/

[alerting]
enabled = false
