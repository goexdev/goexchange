# signer service configuration
# Place at /etc/goexchange/signer.yaml

listen_addr: "10.0.2.5:8443"  # signer subnet

# Server cert (generated by deploy/gen_certs.sh)
tls_cert: "/etc/goexchange/certs/signer.crt"
tls_key: "/etc/goexchange/certs/signer.key"
# CA cert for verifying exchange client certs
client_cas: "/etc/goexchange/certs/ca.crt"

# Security
api_secrets:
  - "${SIGNER_API_SECRET}"  # Loaded from env
allowed_cns:
  - "goexchange-api"
  - "goexchange-chainwatcher"
allowed_ips:
  - "10.0.1.0/24"  # private subnet (business)
rate_limit: 50
timeout: 30s
require_signed: true
audit_log: "/var/log/goexchange/signer-audit.log"

# Vault / HSM configuration
vault:
  type: "vault"  # or "hsm" for production
  address: "https://vault.signer.internal:8200"
  role_id: "${VAULT_ROLE_ID}"
  secret_id: "${VAULT_SECRET_ID}"
  mount: "secret"
  path: "wallets"
