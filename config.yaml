      enabled: false  # disabled 2026-08-31 per BOSS: small exchange, defer ETH trading
      display_name: "Ethereum / Tether"
      min_quantity: "0.001"
      min_price: "0.01"
      price_tick: "0.01"
      quantity_tick: "0.001"
      maker_fee_bps: 10
