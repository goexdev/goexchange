      min_quantity: "1"
      min_price: "0.0001"
      price_tick: "0.0001"
      quantity_tick: "0.01"
      maker_fee_bps: 5
      taker_fee_bps: 10
# Withdraw fees per currency (admin can override via UI)
# Total fee = max(flat, amount * percent), then max(fee, min)
# Stored in DB but seeded from these defaults on first run
withdraw_fees:
  defaults:
    BTC:  { flat: "0.0005", percent: "0.001", min: "0.0001" }
    ETH:  { flat: "0.005",  percent: "0.001", min: "0.001" }
    BNB:  { flat: "0.005",  percent: "0.001", min: "0.01" }
    USDT: { flat: "1.0",    percent: "0",     min: "1.0" }
    USDC: { flat: "1.0",    percent: "0",     min: "1.0" }
    SOL:  { flat: "0.01",   percent: "0.001", min: "0.01" }

