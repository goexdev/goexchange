app:
  port: 8099
  matcher_port: 8098
  scheduler_port: 8097
  env: prod

database:
  url: postgres://exchange:exchange@localhost:5433/exchange?sslmode=disable

redis:
  addr: localhost:6388

jwt:
  # Loaded from Vault secret/auth/jwt in production (see vault.enabled below)
  secret: "471dc55faa0279bdcb6c7e7e0d8c5e7e1e7e7e7e7e7e7e7e7e7e7e7e7e7e7e"
  ttl: 3600

# Vault configuration (HashiCorp Vault for secret storage)
# Set enabled: true to load all secrets from Vault at boot
# When enabled: DB password, JWT secret, signing keys all come from Vault
# When disabled: fall back to config.yaml values
vault:
  enabled: true
  address: "http://127.0.0.1:8200"

  # Auth method
  # auth_method: "static"      # DEV only (NEVER in production)
  auth_method: "approle"      # role_id + secret_id (auto-rotating tokens)
  # Production approle credentials. The role_id is stable; the
  # secret_id is rotated by deploy-fresh.sh and stored in .env as
  # VAULT_TOKEN (the env var is reused for both static and approle
  # — the API picks approle when auth_method=approle). NEVER
  # commit a real secret_id here — leave it empty and let the
  # deploy script populate .env.
  app_role_id: "ab8463f8-9e2d-5f1a-1b78-44514b5016df"
  app_secret_id: ""
  # k8s_role: "goexchange"   # K8s ServiceAccount auth (for K8s deploys)

  # Dev-mode root token from compose VAULT_DEV_ROOT_TOKEN_ID.
  # Used only when auth_method=static (see .env for the
  # approle secret_id that overrides this in production).
  token: "please_change_me"

  # Caching TTL (5 min)
  cache_ttl_sec: 300

  # Paths to secrets. Both paths are loaded at startup; the
  # values in Vault OVERRIDE the corresponding config.yaml
  # entries. Empty path means "skip loading this secret" and
  # keep using config.yaml.
  #
  # db_path: secret containing host/port/user/password/database;
  #          the loader builds `postgres://USER:PASS@HOST:PORT/DB`
  #          and replaces cfg.Database.URL with it.
  # jwt_path: secret containing `secret` (hex) and `ttl_seconds`;
  #          the loader replaces cfg.JWT.Secret with the Vault
  #          value so JWT tokens issued before vs after a rotation
  #          cannot both verify.
  db_path: "db/postgres"
  jwt_path: "auth/jwt"

chainwatcher:
  driver: "evm"
  poll_interval_sec: 10
  min_conf: 6
  mock_interval_sec: 0
  mock_max_amount_usd: 100
  hot_wallet_address: "FgLUhCfLyjxJVez49RGw8n5pDpu5qnip8U"

  chains:
    ltc:
      enabled: false              # disabled - no LTC node in dev
      driver: "btc"
      family: "bitcoin"           # use BTCDeriver
      coin_type: 2                # LTC BIP-44 coin type
      p2pkh_prefix: 0x30          # LTC mainnet P2PKH prefix
      chain_kind: "bitcoin"
      asset: "LTC"
      rpc_url: "http://ltc-node:port"
      min_conf: 6
      poll_interval_sec: 60
      hot_wallet: "LSFmGJugHwcwq6N6sWGJ1oJFZomSLWh9Va"
      signer: "vault"
      vault_secret_path: "secret/ltc/hot-wallet"
      display_name: "Litecoin"
      decimals: 8

    btc:
      enabled: false
      driver: "btc"
      rpc_url: ""
      rpc_user: ""
      rpc_pass: ""
      asset: "BTC"
      min_conf: 6
      hot_wallet: ""
      signer: "btc-core"

    eth:
