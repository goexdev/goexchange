name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'

jobs:
  # ============================================================
  # Backend: Go build + test + lint
  # ============================================================
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange_test
          POSTGRES_DB: exchange
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6388:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install migrate tool
        run: |
          GOBIN=/usr/local/bin go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Build
        run: go build ./...

      - name: Wait for services
        run: |
          for i in 1 2 3 4 5; do
            pg_isready -h localhost -p 5433 -U exchange && break || sleep 2
          done
          # Ping Redis using Python (redis-cli not installed by default)
          python3 -c "import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost', 6388)); s.send(b'PING\r\n'); assert b'PONG' in s.recv(100); print('Redis OK')"

      - name: Run migrations
        env:
          DATABASE_URL: postgres://exchange:exchange_test@localhost:5433/exchange?sslmode=disable
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Run tests
        env:
          DATABASE_URL: postgres://exchange:exchange_test@localhost:5433/exchange?sslmode=disable
          REDIS_ADDR: localhost:6388
        run: go test ./... -timeout 5m

      - name: Run golangci-lint (non-blocking, optional)
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        with:
          version: v1.64.8
          args: --timeout=5m

      # ============================================================
      # Chinese-text protection: GitHub source must never contain
      # Chinese characters (i18n test files are the only allowed
      # exception). Web UI / docs-archive may contain Chinese.
      # ============================================================
      - name: Check for Chinese characters in source
        run: |
          HITS=$(git grep -nP "[\x{4e00}-\x{9fff}]" \
                  -- ':!*.md' \
                  ':!tests/test_i18n.py' \
                  ':!tests/test_withdraw.py' \
                  ':!tests/test_settings.py' || true)
          if [ -n "$HITS" ]; then
            echo "Found Chinese characters in non-i18n source:"
            echo "$HITS"
            exit 1
          fi
          echo "No Chinese characters found in source."

      # ============================================================
      # Banned-string protection: tokens, repo names, competitor
      # names must never be hardcoded in source. The actual banned
      # substrings live in .githooks/banned-strings.conf and are
      # substituted into the placeholder below at install time
      # by deploy-fresh.sh, so this file never embeds the tokens
      # themselves (which would themselves be banned).
      # ============================================================
      - name: Check for banned strings
        run: |
          BANNED_LIST="BANNED_LIST_PLACEHOLDER"
          BANNED=$(grep -rE "$BANNED_LIST" \
                    --exclude-dir=.git \
                    --exclude-dir=node_modules \
                    --exclude-dir=dist \
                    --exclude-dir=.cache \
                    --exclude=*.md \
                    . || true)
          if [ -n "$BANNED" ]; then
            echo "Found banned strings:"
            echo "$BANNED"
            exit 1
          fi
          echo "No banned strings found."

  # ============================================================
  # CI Status: aggregate required jobs
  # ============================================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.backend.result }}" != "success" ]; then
            echo "CI failed"
            echo "  Backend: ${{ needs.backend.result }}"
            exit 1
          fi
          echo "All CI checks passed"
